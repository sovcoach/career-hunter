# career-hunter configuration TEMPLATE.
#
# This file is committed with generic sample values only. Your real config lives at
#   $CAREERHUNTER_DATA_DIR/config.yaml
# (`careerhunter init` copies this template there). Never put personal values here.
#
# Phase 1 validates this file (`careerhunter doctor`). Later phases use it to decide
# which postings to surface and when to notify you.

search:
  # Job titles you are targeting. Matched loosely against posting titles.
  target_titles:
    - Operations Coordinator
    - Customer Success Specialist
    - Project Coordinator
  # Places you would work from or commute to.
  locations:
    - Example City, ON
    - Remote (Canada)
  # Which work models you are open to: onsite, hybrid, remote.
  work_models: [remote, hybrid, onsite]

# Hard gates: a posting failing any of these is skipped, with the reason recorded.
hard_gates:
  min_salary: 55000            # in your local currency, per year
  max_commute_km: 40
  exclude_work_models: []      # e.g. [onsite]

# How postings are scored (0-10). Weights are relative; Phase 3 uses them.
fit_rubric:
  weights:
    title_match: 3
    skills_match: 3
    location_match: 2
    seniority_match: 2
  thresholds:
    strong: 8                  # notify right away
    worth_a_look: 5            # include in the daily digest

schedule:
  timezone: America/Toronto
  watcher_interval_minutes: 60
  quiet_hours:
    start: "21:00"
    end: "07:00"

# Companies to watch directly. ats_type is one of:
# greenhouse, lever, ashby, workday, successfactors, icims, taleo, smartrecruiters,
# jobvite, bamboohr, other
watchlist:
  - name: Example Robotics
    ats_type: greenhouse
    ats_slug: examplerobotics
    careers_url: https://example.com/careers
  - name: Sample Logistics
    ats_type: lever
    ats_slug: samplelogistics
    careers_url: https://example.org/jobs

# EI claims. career-hunter keeps one EI job-search record file per claim,
# ei_record_<label>.db. Set the active claim here: it is never worked out for you.
# A label names the two years a claim spans, like 2026-27, and the claim must start
# in the first of them. Every claim that isn't the active one needs its end date.
# See docs/SETUP.md, "Your EI claim".
ei:
  active_claim: null           # e.g. "2026-27" while you are claiming; null otherwise
  claims: []
  # claims:
  #   - label: "2026-27"
  #     start: 2026-08-02      # the start date Service Canada gave you
  #     end: 2027-07-31        # optional while the claim is active
