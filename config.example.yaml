# career-hunter configuration TEMPLATE.
#
# This file is committed with generic sample values only. Your real config lives at
#   $CAREERHUNTER_DATA_DIR/config.yaml
# (`careerhunter init` copies this template there). Never put personal values here.
#
# `careerhunter doctor` checks this file. `careerhunter watch` and the bot read it to
# decide which boards to fetch and which postings to skip, score and alert.

search:
  # target_titles, locations and work_models still validate so an older file loads.
  # Nothing matches them: use lanes and location_rules below. target_titles may be
  # left out when lanes are set.
  target_titles:
    - Operations Coordinator
    - Customer Success Specialist
    - Project Coordinator
  locations:
    - Example City
    - Remote (Canada)
  work_models: [remote, hybrid, onsite]
  # Optional: target titles grouped into lanes by priority. A title may be a list of
  # variants that count as one title, matched as whole words in any case. Lanes label
  # and order alerts and never skip a posting. A fallback lane ranks below an equally
  # good fit in any other lane. Without lanes, alerts go by fit, then oldest.
  # When no lane matches literally, a title of two or more words then Specialist,
  # Analyst or Associate also matches the same words with any of those three,
  # ignoring level words (Junior, Senior, II, Level 2 ...) and reading
  # "Analyst, Client Experience" as "Client Experience Analyst". After changing
  # lanes, run: careerhunter lanes reassign --dry-run
  lanes:
    - name: operations
      priority: 1
      titles:
        - Operations Coordinator
        - [Project Coordinator, Project Assistant]
    - name: customer_success
      priority: 2
      fallback: true
      titles:
        - Customer Success Specialist
  # Optional: the lowest fit (low, medium or high) at which a posting whose title
  # matches no lane still alerts, labelled Off-lane and sent last. Default high.
  off_lane_min_fit: high
  # Optional. Postings older than this many days (by the board's posted date, or
  # the day first seen when the board gives none) are skipped as too_old. 1 to 365,
  # default 7.
  max_posting_age_days: 7
  # Optional: where each work model is acceptable. With no work model from the board,
  # a location saying "remote" counts as remote and anything else as on-site.
  location_rules:
    onsite_hybrid: ["Example City"]  # on-site and hybrid only here
    remote: [Canada]                    # fully remote only within these regions
    allow_travel_outside: false         # refuse roles needing office days elsewhere
  # Optional. After `careerhunter resume import <file>`, set this to
  # resume/current.txt (no other value is used) so scoring and embeddings read your
  # resume. Null leaves the resume out of scoring and skips embeddings.
  resume: null

# Hard gates: a posting failing any of these is skipped, with the reason recorded.
hard_gates:
  min_salary: null             # yearly CAD; skipped when the top of the stated range is below it; null turns it off
  max_commute_km: 40           # validated; not applied
  exclude_work_models: []      # validated; not applied (use location_rules)
  # Optional gates; a posting that trips one is skipped with that reason. A key that
  # is not one of these is refused.
  required_languages: []       # skip postings that require any of these languages
  credentials: []              # licences, clearances or designations you can't get
  shift_patterns: [overnight]  # e.g. rotating, overnight, 24/7
  pay_structures: [commission_only]
  seniority_words: [Senior, Director]  # whole words of the title, any case
  seniority_in_description: false     # true also checks the description for those words
  title_exceptions: []         # titles allowed despite containing a seniority word
  never_gated_families: []     # title families gated only when explicitly senior

# How postings are scored: the local model lists the requirements a posting asks for
# that you are missing, and gap_tiers turns the count into a tier and a fit.
fit_rubric:
  # weights and thresholds still validate so an older file loads, and are not applied.
  # With gap_tiers set they can be left out.
  weights:
    title_match: 3
    skills_match: 3
    location_match: 2
    seniority_match: 2
  thresholds:
    strong: 8
    worth_a_look: 5
  gap_tiers:
    tiers:                     # best first, by the most gaps the tier allows
      # fit is required on every tier: low, medium or high. Alerts show it, and a
      # boundary outcome takes the fit of the tier it names.
      - {name: strong, max_gaps: 1, fit: high}
      - {name: possible, max_gaps: 2, fit: medium}
    exclude_from_gaps: 3       # this many gaps or more: skip
    boundary:                  # at exactly this many gaps, decide by the kind of gap
      at_gaps: 1
      all_minor: strong        # every gap learnable or nice-to-have
      any_core: possible       # any gap core to the job
    exempt_requirements: []    # requirement types that never count as a gap
  # Optional number from 0 to 1. The watcher does not use it for skips, alerts, or
  # what it stores. embed-eval ranks a blend with it when it is set. Null leaves it unset.
  embedding_weight: null

# Optional: the model identifiers sent to LM Studio on this Mac (see docs/SETUP.md,
# "Run the local models"). Use the identifier LM Studio shows for each loaded model.
# Text of 1 to 200 characters; unset or null sends local-model and local-embedding.
# The server addresses are fixed loopback URLs and are not set here.
scoring:
  chat_model: null             # e.g. example-chat-model
  embedding_model: null        # e.g. example-embedding-model

schedule:
  # A zone name (Europe/Berlin) or a fixed offset (UTC, UTC+05:30); UTC if unset.
  timezone: UTC
  watcher_interval_minutes: 60    # optional; minutes between watch runs, minimum 15
  # Quiet hours are not implemented. Alerts go out whenever the bot polls.

# Optional: limits on the work schedule. Anything above a limit is flagged (or
# excluded, with over_limit: exclude).
schedule_limits:
  weekend_days_per_month: 2
  over_limit: flag

# Companies to watch directly. `careerhunter watch` fetches greenhouse, lever,
# ashby, smartrecruiters and bamboohr from ats_slug (one path segment; for bamboohr,
# the company's subdomain) and ignores careers_url. A workday board also needs its
# host and site: ats_slug is the tenant, ats_host the wdN host and ats_site the site,
# as in https://<tenant>.<wdN>.myworkdayjobs.com/<site>. Other ats_type values are
# kept here and not fetched. ats_type is one of:
# greenhouse, lever, ashby, workday, successfactors, icims, taleo, smartrecruiters,
# jobvite, bamboohr, other
#
# The list starts empty, so `careerhunter watch` fetches nothing until you add your
# own boards. To start from the examples, replace `watchlist: []` with the block
# below, remove the leading "# " from each of its lines, and put in real companies.
# The Workday entry stays commented until you also remove its second "# ".
watchlist: []
# watchlist:
#   - name: Example Robotics
#     ats_type: greenhouse
#     ats_slug: examplerobotics
#     careers_url: https://example.com/careers
#   - name: Sample Logistics
#     ats_type: lever
#     ats_slug: samplelogistics
#     careers_url: https://example.org/jobs
#     role_filters:              # optional: only these roles at this company
#       role_families: [support, operations]
#       work_models: [remote, hybrid]
#   # A Workday board, for example:
#   # - name: Example Freight
#   #   ats_type: workday
#   #   ats_slug: examplefreight   # the tenant
#   #   ats_host: wd5
#   #   ats_site: External
#   - name: Example Staffing
#     agency: true               # optional: a staffing agency, labelled as such

# Optional discovery settings (ADR-020). A null URL leaves discovery off.
# A set URL is plain http to 127.0.0.1, localhost, or ::1, with no userinfo.
# career_hosts lists extra hostnames to search with site:, no scheme, path,
# wildcard, or "..". Career pages are not queued.
# Discovery runs inside the watch agent, at most once per interval_minutes
# (missing or null means 1440; the minimum is 60). Each pass sends the next
# queries_per_run queries (1 to 40), query_delay_seconds apart (2 to 30); the
# two multiplied are at most 120 seconds.
discovery:
  searxng_url: null
  career_hosts: []
  interval_minutes: 1440
  queries_per_run: 12
  query_delay_seconds: 5

# EI claims. career-hunter keeps one EI job-search record file per claim,
# ei_record_<label>.db. Set the active claim here: it is never worked out for you.
# A label names the two years a claim spans, like 2026-27, and the claim must start
# in the first of them. Every claim that isn't the active one needs its end date.
# See docs/SETUP.md, "Your EI claim".
ei:
  active_claim: null           # e.g. "2026-27" while you are claiming; null otherwise
  claims: []
  # claims:
  #   - label: "2026-27"
  #     start: 2026-08-02      # the start date Service Canada gave you
  #     end: 2027-07-31        # optional while the claim is active

# Telegram. The bot only ever talks to this one private chat. Find the id
# with `careerhunter bot discover` (see docs/SETUP.md).
telegram:
  chat_id: null                # e.g. 123456789

# Optional: watcher alerts. The bot sends one digest per watch run, at most this many
# postings per poll (1-50, default 10); the rest carry over to the next poll.
alerts:
  max_per_poll: 10
  # Optional: a weekly message of counts by lane (alerts, Applied, Skipped, responses,
  # outcomes), at this day and hour in schedule.timezone. Counts only: no titles. Null
  # turns it off.
  weekly_digest: null          # e.g. {day: monday, hour: 9}

# Optional: the learning loop (#43). The scoring prompt shows the local model up to this
# many postings you labelled recently: their title, lane, number of gaps, and what you
# decided (applied and its latest status, or skipped). 0 to 20, default 5; 0 sends none.
# Only the local model sees them. Rules and thresholds never change by themselves.
learning:
  labelled_examples: 5

# Optional: health (#42). doctor warns after this many watch runs, or discovery passes,
# in a row that did no useful work; the bot sends one message after this many runs in
# a row in which the local model, SearXNG, or every board failed, and one when it
# works again. Each from 1 to 50, default 3.
health:
  unproductive_runs: 3
  failure_runs: 3
