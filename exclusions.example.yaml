# career-hunter exclusions TEMPLATE (generic sample values only).
# Your real file lives at $CAREERHUNTER_DATA_DIR/exclusions.yaml.
#
# Postings matching any of these are skipped, and the skip is recorded with a reason.

companies:
  - Example Staffing Mill
title_keywords:
  - Senior Director
  - Commission Only
description_keywords:
  - unpaid
# Optional: exclude one role at one company, without excluding the company or a
# keyword. location and requisition_id narrow it further.
roles:
  - company: Example Robotics
    title: Night Shift Supervisor
# Optional: never resurface roles you have already applied to (from search.db).
exclude_applied: true
