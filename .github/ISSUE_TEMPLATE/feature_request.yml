name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase (if known)
      options:
        - Not sure
        - Phase 1 - Foundation
        - Phase 2 - Notifications
        - Phase 3 - Watcher
        - Phase 4 - Discovery
        - Phase 5 - Release
