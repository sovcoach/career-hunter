[project]
name = "career-hunter"
version = "0.3.0"
description = "Self-hosted job-search tracker that doubles as an EI job-search record."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
    "keyring>=25.6",
    "reportlab>=4.4",
    "truststore>=0.10",
]

[project.scripts]
careerhunter = "careerhunter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "mypy>=1.18",
    "types-PyYAML>=6.0",
    "ruff>=0.14",
    "pre-commit>=4.3",
]

[tool.uv]
# ADR-006: uv lock may only pick releases uploaded before this cutoff. Move it forward
# deliberately at each re-lock, to at most 14 days before the re-lock commit.
exclude-newer = "2026-10-17T17:31:54Z"
# A single version the cutoff would keep that breaks the rule and fixes no advisory.
exclude-newer-package = { ast-serialize = "2026-10-16T00:00:00Z" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerhunter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607"]  # subprocess calls use fixed argv lists of system tools

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"scripts/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["keyring.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["careerhunter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
